name: Publish release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    # Release tags must match the Minecraft-mod version in gradle.properties,
    # for example 26.1.2-0.1.0.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, '26.1.2-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          test "$GITHUB_REF_NAME" = "$(./gradlew -q properties --no-daemon | awk '/^version: / { print $2; exit }')"

      - name: Build, test, and publish Maven package
        run: ./gradlew clean build publish --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish installable JAR to CurseForge
        if: github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          files: build/libs/integratedide-*.jar
          name: Integrated IDE ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: ${{ contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || 'release' }}
          changelog: Automated release built from Git tag ${{ github.ref_name }}.
          loaders: neoforge
          environment: client
          game-versions: 26.1.2
          java: 25
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: |
            integrated-dynamics(required)
            cyclops-core(required)
            common-capabilities(required)

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v6
        with:
          name: integratedide-${{ github.ref_name }}
          path: build/libs/integratedide-*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release with installable JAR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("$GITHUB_REF_NAME" build/libs/integratedide-*.jar --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
