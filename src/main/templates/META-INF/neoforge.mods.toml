license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/5o1/Integrated-IDE"
authors="5o1"
description='''
Client-side IDE and Logic Programmer enhancement for Integrated Dynamics.
'''

# This mod is annotated for Dist.CLIENT. Every loader dependency is therefore
# declared for the client as well; it must not be installed on a dedicated server.
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="integrateddynamics"
type="required"
versionRange="${integrateddynamics_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="cyclopscore"
type="required"
versionRange="${cyclopscore_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="commoncapabilities"
type="required"
versionRange="${commoncapabilities_version_range}"
ordering="AFTER"
side="CLIENT"
